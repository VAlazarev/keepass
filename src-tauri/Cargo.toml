[package]
name = "keepass-drive-vault"
version = "0.1.0"
description = "Personal encrypted password vault with Google Drive synchronization"
authors = ["Keepass Drive Vault"]
edition = "2021"

[lib]
name = "keepass_drive_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
